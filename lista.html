<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lista de Presentes</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #7f1d1d;
    --bg2: #450a0a;
    --card: #fffaf3;
    --ink: #2b1a12;
    --muted: #7a6355;
    --accent: #15803d;
    --red: #b91c1c;
    --gold: #d4a017;
    --line: #eadfd2;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 50% 0%, var(--bg), var(--bg2)) fixed;
    color: var(--ink);
    min-height: 100vh;
    padding: 24px 16px 48px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  header { text-align: center; color: #fff; margin-bottom: 20px; }
  header .emoji { font-size: 44px; }
  header h1 { margin: 8px 0 4px; font-size: 24px; }
  header p { margin: 0; opacity: .85; font-size: 15px; }
  .busca {
    width: 100%; padding: 14px 16px; font-size: 16px;
    border: 0; border-radius: 999px; margin-bottom: 16px;
    background: var(--card); color: var(--ink);
  }
  .pessoa {
    background: var(--card); border-radius: 16px;
    padding: 16px 18px; margin-bottom: 12px;
    border-left: 5px solid var(--gold);
    scroll-margin-top: 16px;
  }
  .pessoa.alvo { outline: 3px solid var(--gold); }
  .pessoa h2 { margin: 0; font-size: 19px; }
  .pessoa .info { color: var(--muted); font-size: 14px; font-weight: 400; }
  ul { margin: 10px 0 0; padding: 0; list-style: none; }
  li { padding: 8px 0; border-top: 1px solid var(--line); line-height: 1.4; }
  li:first-child { border-top: 0; }
  a.item {
    color: var(--accent); font-weight: 600; text-decoration: none;
    word-break: break-word;
  }
  a.item::after { content: " ↗"; font-weight: 400; }
  .obs { display: block; color: var(--muted); font-size: 14px; }
  .vazio { color: var(--muted); font-style: italic; margin: 8px 0 0; font-size: 15px; }
  .nada { color: #fff; text-align: center; opacity: .85; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="emoji">🎁</div>
    <h1>Lista de Presentes</h1>
    <p>Procure o nome do seu amigo secreto e veja o que ele quer ganhar</p>
  </header>

  <input class="busca" id="busca" type="search" placeholder="Buscar nome…" autocomplete="off">
  <div id="lista"></div>
  <p class="nada" id="nada" hidden>Nenhum nome encontrado.</p>
</div>

<script>
  // Cada pedido: { t: "texto", u: "link (opcional)", o: "observação (opcional)" }
  var pessoas = [
    { n: "Olga", d: [] },
    { n: "Nilton", d: [] },
    { n: "Lucca", d: [] },
    { n: "Fátima", d: [] },
    { n: "Bruna", d: [] },
    { n: "Hyun", i: "namorado da Bruna", d: [] },
    { n: "Thabattn", d: [] },
    { n: "Mari", i: "namorada do Lucca", d: [] },
    { n: "Hariel", i: "criança", d: [] },
    { n: "Kamile", d: [] },
    { n: "Phellype", d: [] },
    { n: "Scharlo", d: [] },
    { n: "Rose", d: [] },
    { n: "Paulo", d: [] },
    { n: "Maicon", d: [] },
    { n: "Eloah", i: "criança", d: [] },
    { n: "Biti", i: "anfitriã", d: [] },
    { n: "Thay", d: [] },
    { n: "Jean", i: "namorado da Thay", d: [] },
    { n: "Carol", i: "mora em Londres", d: [] },
    { n: "Sabrina", i: "mora em Londres", d: [] },
    { n: "Dilceu", i: "japa", d: [] },
    { n: "Ayumi", i: "namorada do Bruno", d: [] },
    { n: "Bruno", d: [] },
    { n: "Mario", d: [] },
    { n: "Bia", d: [] },
    { n: "Gabriele", i: "criança", d: [] }
  ];

  function slug(s) {
    return s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  }

  var lista = document.getElementById("lista");
  pessoas.forEach(function (p) {
    var card = document.createElement("section");
    card.className = "pessoa";
    card.id = slug(p.n);
    card.dataset.busca = slug(p.n + " " + (p.i || ""));

    var h = document.createElement("h2");
    h.textContent = p.n + " ";
    if (p.i) {
      var info = document.createElement("span");
      info.className = "info";
      info.textContent = "(" + p.i + ")";
      h.appendChild(info);
    }
    card.appendChild(h);

    if (!p.d.length) {
      var v = document.createElement("p");
      v.className = "vazio";
      v.textContent = "Ainda não mandou a lista.";
      card.appendChild(v);
    } else {
      var ul = document.createElement("ul");
      p.d.forEach(function (item) {
        var li = document.createElement("li");
        if (item.u) {
          var a = document.createElement("a");
          a.className = "item";
          a.href = item.u;
          a.target = "_blank";
          a.rel = "noopener";
          a.textContent = item.t || "Ver presente";
          li.appendChild(a);
        } else {
          li.appendChild(document.createTextNode(item.t));
        }
        if (item.o) {
          var o = document.createElement("span");
          o.className = "obs";
          o.textContent = item.o;
          li.appendChild(o);
        }
        ul.appendChild(li);
      });
      card.appendChild(ul);
    }
    lista.appendChild(card);
  });

  document.getElementById("busca").addEventListener("input", function (e) {
    var q = slug(e.target.value.trim());
    var algum = false;
    document.querySelectorAll(".pessoa").forEach(function (c) {
      var ok = !q || c.dataset.busca.indexOf(q) !== -1;
      c.hidden = !ok;
      if (ok) algum = true;
    });
    document.getElementById("nada").hidden = algum;
  });

  // lista.html#nome → rola até a pessoa e destaca
  var alvo = decodeURIComponent(location.hash.slice(1));
  if (alvo) {
    var el = document.getElementById(slug(alvo));
    if (el) { el.classList.add("alvo"); el.scrollIntoView(); }
  }
</script>
</body>
</html>
